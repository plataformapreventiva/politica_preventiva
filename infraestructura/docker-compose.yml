version: "3"

services:                                                                               
  luigi-server:        
    image: politica_preventiva/luigi-server                                                                 
    ports:                                                                              
      - "8082:8082"
    env_file: .env
    networks:
      - politica_preventiva_net

#  luigi-worker:
#    image: politica_preventiva/luigi-worker
#    env_file: .env
#    networks:
#      - politica_preventiva_net


  graphdb:
    image: neo4j:3.1
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - politica_preventiva_net


volumes:
  politica_preventiva_store:
    external:
      name: politica_preventiva_store

networks:
  politica_preventiva_net:  
    external: true
